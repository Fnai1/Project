name: 1C CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      config_name:
        description: 'Configuration name (CF file)'
        required: false
        default: 'config'
        type: string

env:
  CONFIG_NAME: ${{ github.event.inputs.config_name || 'config' }}
  ONEC_PLATFORM: ${{ secrets.ONEC_PLATFORM }}
  STORAGE: ${{ secrets.STORAGE }}
  STORAGE_USER: ${{ secrets.STORAGE_USER }}
  STORAGE_PWD: ${{ secrets.STORAGE_PWD }}
  TEST_IB_CONN: ${{ secrets.TEST_IB_CONN }}
  TEST_IB_USER: ${{ secrets.TEST_IB_USER }}
  TEST_IB_PWD: ${{ secrets.TEST_IB_PWD }}
  PUBLISH_URL: ${{ secrets.PUBLISH_URL }}
  NTFY_TOPIC: fnai1-cicd-notifications

jobs:
  build:
    name: Build Configuration
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Prepare directories
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "artifacts/build" -Force | Out-Null
          New-Item -ItemType Directory -Path "artifacts/backups" -Force | Out-Null
          New-Item -ItemType Directory -Path "artifacts/logs" -Force | Out-Null
          Write-Host "Config name: $env:CONFIG_NAME"

      - name: Build from storage to CF
        shell: powershell
        run: |
          $params = @{
            Platform = $env:ONEC_PLATFORM
            Storage = $env:STORAGE
            StorageUser = $env:STORAGE_USER
            OutCf = "artifacts/build/${{ env.CONFIG_NAME }}.cf"
          }
          if ($env:STORAGE_PWD) {
            $params['StoragePwd'] = $env:STORAGE_PWD
          }
          & powershell -File scripts/build-1c.ps1 @params

      - name: Create backup copy
        shell: powershell
        run: |
          & powershell -File scripts/simple-build.ps1 `
            -Source "artifacts/build/${{ env.CONFIG_NAME }}.cf" `
            -BackupDir "artifacts/backups" `
            -Prefix "${{ env.CONFIG_NAME }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 1c-configuration-${{ github.run_id }}
          path: artifacts/
          retention-days: 30

      - name: Notify build status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            EMOJI="white_check_mark"
            STATUS="SUCCESS"
            PRIORITY="default"
          else
            EMOJI="x"
            STATUS="FAILED"
            PRIORITY="urgent"
          fi
          
          curl -H "Title: 🔨 Build $STATUS" \
               -H "Priority: $PRIORITY" \
               -H "Tags: $EMOJI,package" \
               -d "Configuration: ${{ env.CONFIG_NAME }}
Branch: ${{ github.ref_name }}
Commit: ${{ github.sha }}
Author: ${{ github.actor }}" \
               ntfy.sh/${{ env.NTFY_TOPIC }}

  test_deploy:
    name: Test and Deploy
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: 1c-configuration-${{ github.run_id }}
          path: artifacts
          merge-multiple: false

      - name: Prepare logs directory
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "artifacts/logs" -Force | Out-Null

      - name: Verify CF file
        shell: powershell
        run: |
          if (-not (Test-Path "artifacts/build/${{ env.CONFIG_NAME }}.cf")) { 
            Write-Error "CF file not found"
            exit 1 
          }
          Write-Host "CF file found: ${{ env.CONFIG_NAME }}.cf"
          Get-ChildItem -Recurse artifacts | Format-Table FullName

      - name: Deploy to infobase
        id: deploy_step
        shell: powershell
        continue-on-error: true
        run: |
          $params = @{
            Platform = $env:ONEC_PLATFORM
            Infobase = $env:TEST_IB_CONN
            Cf = "artifacts/build/${{ env.CONFIG_NAME }}.cf"
          }
          if ($env:TEST_IB_USER) {
            $params['IBUser'] = $env:TEST_IB_USER
          }
          if ($env:TEST_IB_PWD) {
            $params['IBPwd'] = $env:TEST_IB_PWD
          }
          & powershell -File scripts/deploy-1c.ps1 @params

      - name: Smoke test
        id: test_step
        shell: powershell
        continue-on-error: true
        run: |
          $params = @{
            Platform = $env:ONEC_PLATFORM
            Infobase = $env:TEST_IB_CONN
          }
          if ($env:TEST_IB_USER) {
            $params['IBUser'] = $env:TEST_IB_USER
          }
          if ($env:TEST_IB_PWD) {
            $params['IBPwd'] = $env:TEST_IB_PWD
          }
          & powershell -File tests/smoke.ps1 @params

      - name: Generate deployment log
        if: always()
        shell: powershell
        run: |
          $deployStatus = "${{ steps.deploy_step.outcome }}"
          $testStatus = "${{ steps.test_step.outcome }}"
          $overallStatus = if ($deployStatus -eq 'success' -and $testStatus -eq 'success') { "SUCCESS" } else { "FAILED" }
          
          $log = "artifacts/logs/deploy-$($env:GITHUB_RUN_ID).log"
          @"
          ==============================================
          1C CI/CD Pipeline Deployment Log
          ==============================================
          Configuration: $env:CONFIG_NAME
          Overall Status: $overallStatus
          Deploy Status: $deployStatus
          Test Status: $testStatus
          Run ID: $env:GITHUB_RUN_ID
          Branch: $env:GITHUB_REF_NAME
          Commit: $env:GITHUB_SHA
          Actor: $env:GITHUB_ACTOR
          Time: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
          ==============================================
          "@ | Out-File $log -Encoding UTF8
          Get-Content $log

      - name: Notify deploy status
        if: always()
        run: |
          DEPLOY_STATUS="${{ steps.deploy_step.outcome }}"
          TEST_STATUS="${{ steps.test_step.outcome }}"
          
          if [ "$DEPLOY_STATUS" == "success" ] && [ "$TEST_STATUS" == "success" ]; then
            EMOJI="white_check_mark"
            STATUS="SUCCESS"
            PRIORITY="default"
            TAGS="white_check_mark,rocket"
          elif [ "$DEPLOY_STATUS" == "failure" ] || [ "$TEST_STATUS" == "failure" ]; then
            EMOJI="x"
            STATUS="FAILED"
            PRIORITY="urgent"
            TAGS="x,warning"
          else
            EMOJI="warning"
            STATUS="PARTIAL"
            PRIORITY="high"
            TAGS="warning,wrench"
          fi
          
          MESSAGE="Configuration: ${{ env.CONFIG_NAME }}"
          MESSAGE="$MESSAGE\nDeploy: $DEPLOY_STATUS"
          MESSAGE="$MESSAGE\nTests: $TEST_STATUS"
          MESSAGE="$MESSAGE\nBranch: ${{ github.ref_name }}"
          MESSAGE="$MESSAGE\nAuthor: ${{ github.actor }}"
          MESSAGE="$MESSAGE\n\nView: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          curl -H "Title: 🚀 Deploy $STATUS" \
               -H "Priority: $PRIORITY" \
               -H "Tags: $TAGS" \
               -H "Click: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
               -d "$MESSAGE" \
               ntfy.sh/${{ env.NTFY_TOPIC }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs-${{ github.run_id }}
          path: artifacts/logs/
          retention-days: 7

  notify_summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [build, test_deploy]
    if: always()
    steps:
      - name: Determine overall status
        id: status
        run: |
          BUILD_STATUS="${{ needs.build.result }}"
          DEPLOY_STATUS="${{ needs.test_deploy.result }}"
          
          if [ "$BUILD_STATUS" == "success" ] && [ "$DEPLOY_STATUS" == "success" ]; then
            echo "status=SUCCESS" >> $GITHUB_OUTPUT
            echo "emoji=tada" >> $GITHUB_OUTPUT
            echo "priority=default" >> $GITHUB_OUTPUT
          elif [ "$BUILD_STATUS" == "failure" ] || [ "$DEPLOY_STATUS" == "failure" ]; then
            echo "status=FAILED" >> $GITHUB_OUTPUT
            echo "emoji=x" >> $GITHUB_OUTPUT
            echo "priority=urgent" >> $GITHUB_OUTPUT
          else
            echo "status=PARTIAL" >> $GITHUB_OUTPUT
            echo "emoji=warning" >> $GITHUB_OUTPUT
            echo "priority=high" >> $GITHUB_OUTPUT
          fi

      - name: Send summary notification
        run: |
          MESSAGE="📊 Pipeline Summary"
          MESSAGE="$MESSAGE\n\nConfiguration: ${{ env.CONFIG_NAME }}"
          MESSAGE="$MESSAGE\nBuild: ${{ needs.build.result }}"
          MESSAGE="$MESSAGE\nDeploy: ${{ needs.test_deploy.result }}"
          MESSAGE="$MESSAGE\n\nOverall: ${{ steps.status.outputs.status }}"
          MESSAGE="$MESSAGE\nBranch: ${{ github.ref_name }}"
          MESSAGE="$MESSAGE\nCommit: ${{ github.sha }}"
          MESSAGE="$MESSAGE\nAuthor: ${{ github.actor }}"
          MESSAGE="$MESSAGE\n\nView full report:"
          MESSAGE="$MESSAGE\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          curl -H "Title: 📊 1C CI/CD - ${{ steps.status.outputs.status }}" \
               -H "Priority: ${{ steps.status.outputs.priority }}" \
               -H "Tags: ${{ steps.status.outputs.emoji }},chart_with_upwards_trend" \
               -H "Click: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
               -d "$MESSAGE" \
               ntfy.sh/${{ env.NTFY_TOPIC }}
