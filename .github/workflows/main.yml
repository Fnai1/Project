name: 1C CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      config_name:
        description: 'Configuration name (CF file)'
        required: false
        default: 'config'
        type: string

env:
  CONFIG_NAME: ${{ github.event.inputs.config_name || 'config' }}
  ONEC_PLATFORM: ${{ secrets.ONEC_PLATFORM }}
  STORAGE: ${{ secrets.STORAGE }}
  STORAGE_USER: ${{ secrets.STORAGE_USER }}
  STORAGE_PWD: ${{ secrets.STORAGE_PWD }}
  TEST_IB_CONN: ${{ secrets.TEST_IB_CONN }}
  TEST_IB_USER: ${{ secrets.TEST_IB_USER }}
  TEST_IB_PWD: ${{ secrets.TEST_IB_PWD }}
  PUBLISH_URL: ${{ secrets.PUBLISH_URL }}

jobs:
  build:
    name: Build Configuration
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Prepare directories
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "artifacts/build" -Force | Out-Null
          New-Item -ItemType Directory -Path "artifacts/backups" -Force | Out-Null
          New-Item -ItemType Directory -Path "artifacts/logs" -Force | Out-Null
          Write-Host "Config name: $env:CONFIG_NAME"

      - name: Build from storage to CF
        shell: powershell
        run: |
          $params = @{
            Platform = $env:ONEC_PLATFORM
            Storage = $env:STORAGE
            StorageUser = $env:STORAGE_USER
            OutCf = "artifacts/build/${{ env.CONFIG_NAME }}.cf"
          }
          if ($env:STORAGE_PWD) {
            $params['StoragePwd'] = $env:STORAGE_PWD
          }
          & powershell -File scripts/build-1c.ps1 @params

      - name: Create backup copy
        shell: powershell
        run: |
          & powershell -File scripts/simple-build.ps1 `
            -Source "artifacts/build/${{ env.CONFIG_NAME }}.cf" `
            -BackupDir "artifacts/backups" `
            -Prefix "${{ env.CONFIG_NAME }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 1c-configuration-${{ github.run_id }}
          path: artifacts/
          retention-days: 30

  test_deploy:
    name: Test and Deploy
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: 1c-configuration-${{ github.run_id }}
          path: artifacts
          merge-multiple: false

      - name: Prepare logs directory
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "artifacts/logs" -Force | Out-Null

      - name: Verify CF file
        shell: powershell
        run: |
          if (-not (Test-Path "artifacts/build/${{ env.CONFIG_NAME }}.cf")) { 
            Write-Error "CF file not found"
            exit 1 
          }
          Write-Host "CF file found: ${{ env.CONFIG_NAME }}.cf"
          Get-ChildItem -Recurse artifacts | Format-Table FullName

      - name: Deploy to infobase
        shell: powershell
        continue-on-error: true
        run: |
          $params = @{
            Platform = $env:ONEC_PLATFORM
            Infobase = $env:TEST_IB_CONN
            Cf = "artifacts/build/${{ env.CONFIG_NAME }}.cf"
          }
          if ($env:TEST_IB_USER) {
            $params['IBUser'] = $env:TEST_IB_USER
          }
          if ($env:TEST_IB_PWD) {
            $params['IBPwd'] = $env:TEST_IB_PWD
          }
          & powershell -File scripts/deploy-1c.ps1 @params

      - name: Smoke test
        shell: powershell
        continue-on-error: true
        run: |
          $params = @{
            Platform = $env:ONEC_PLATFORM
            Infobase = $env:TEST_IB_CONN
          }
          if ($env:TEST_IB_USER) {
            $params['IBUser'] = $env:TEST_IB_USER
          }
          if ($env:TEST_IB_PWD) {
            $params['IBPwd'] = $env:TEST_IB_PWD
          }
          & powershell -File tests/smoke.ps1 @params

      - name: Generate deployment log
        if: always()
        shell: powershell
        run: |
          $status = if ($LASTEXITCODE -eq 0) { "SUCCESS" } else { "FAIL" }
          $log = "artifacts/logs/deploy-$($env:GITHUB_RUN_ID).log"
          @"
          ==============================================
          1C CI/CD Pipeline Deployment Log
          ==============================================
          Configuration: $env:CONFIG_NAME
          Status: $status
          Run ID: $env:GITHUB_RUN_ID
          Branch: $env:GITHUB_REF_NAME
          Commit: $env:GITHUB_SHA
          Time: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
          ==============================================
          "@ | Out-File $log -Encoding UTF8
          Get-Content $log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs-${{ github.run_id }}
          path: artifacts/logs/
          retention-days: 7
