name: 1C CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      config_name:
        description: 'Configuration name (CF file)'
        required: false
        default: 'config'
        type: string

env:
  CONFIG_NAME: ${{ github.event.inputs.config_name || 'config' }}
  ONEC_PLATFORM: ${{ secrets.ONEC_PLATFORM }}
  STORAGE: ${{ secrets.STORAGE }}
  STORAGE_USER: ${{ secrets.STORAGE_USER }}
  STORAGE_PWD: ${{ secrets.STORAGE_PWD }}
  TEST_IB_CONN: ${{ secrets.TEST_IB_CONN }}
  TEST_IB_USER: ${{ secrets.TEST_IB_USER }}
  TEST_IB_PWD: ${{ secrets.TEST_IB_PWD }}
  PUBLISH_URL: ${{ secrets.PUBLISH_URL }}

jobs:
  build:
    name: Build Configuration
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Prepare directories
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "artifacts/build" -Force | Out-Null
          New-Item -ItemType Directory -Path "artifacts/backups" -Force | Out-Null
          New-Item -ItemType Directory -Path "artifacts/logs" -Force | Out-Null
          Write-Host "Config name: $env:CONFIG_NAME"

      - name: Build from storage to CF
        shell: powershell
        run: |
          $params = @{
            Platform = $env:ONEC_PLATFORM
            Storage = $env:STORAGE
            StorageUser = $env:STORAGE_USER
            OutCf = "artifacts/build/${{ env.CONFIG_NAME }}.cf"
          }
          if ($env:STORAGE_PWD) {
            $params['StoragePwd'] = $env:STORAGE_PWD
          }
          & powershell -File scripts/build-1c.ps1 @params

      - name: Create backup copy
        shell: powershell
        run: |
          & powershell -File scripts/simple-build.ps1 `
            -Source "artifacts/build/${{ env.CONFIG_NAME }}.cf" `
            -BackupDir "artifacts/backups" `
            -Prefix "${{ env.CONFIG_NAME }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 1c-configuration-${{ github.run_id }}
          path: artifacts/
          retention-days: 30

  test_deploy:
    name: Test and Deploy
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/main'
    outputs:
      deploy_status: ${{ steps.deploy_step.outcome }}
      test_status: ${{ steps.test_step.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: 1c-configuration-${{ github.run_id }}
          path: artifacts
          merge-multiple: false

      - name: Prepare logs directory
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "artifacts/logs" -Force | Out-Null

      - name: Verify CF file
        shell: powershell
        run: |
          if (-not (Test-Path "artifacts/build/${{ env.CONFIG_NAME }}.cf")) { 
            Write-Error "CF file not found"
            exit 1 
          }
          Write-Host "CF file found: ${{ env.CONFIG_NAME }}.cf"
          Get-ChildItem -Recurse artifacts | Format-Table FullName

      - name: Deploy to infobase
        id: deploy_step
        shell: powershell
        continue-on-error: true
        run: |
          $params = @{
            Platform = $env:ONEC_PLATFORM
            Infobase = $env:TEST_IB_CONN
            Cf = "artifacts/build/${{ env.CONFIG_NAME }}.cf"
          }
          if ($env:TEST_IB_USER) {
            $params['IBUser'] = $env:TEST_IB_USER
          }
          if ($env:TEST_IB_PWD) {
            $params['IBPwd'] = $env:TEST_IB_PWD
          }
          & powershell -File scripts/deploy-1c.ps1 @params

      - name: Smoke test
        id: test_step
        shell: powershell
        continue-on-error: true
        run: |
          $params = @{
            Platform = $env:ONEC_PLATFORM
            Infobase = $env:TEST_IB_CONN
          }
          if ($env:TEST_IB_USER) {
            $params['IBUser'] = $env:TEST_IB_USER
          }
          if ($env:TEST_IB_PWD) {
            $params['IBPwd'] = $env:TEST_IB_PWD
          }
          & powershell -File tests/smoke.ps1 @params

      - name: Generate deployment log
        if: always()
        shell: powershell
        run: |
          $deployStatus = "${{ steps.deploy_step.outcome }}"
          $testStatus = "${{ steps.test_step.outcome }}"
          $overallStatus = if ($deployStatus -eq 'success' -and $testStatus -eq 'success') { "SUCCESS" } else { "FAILED" }
          
          $log = "artifacts/logs/deploy-$($env:GITHUB_RUN_ID).log"
          @"
          ==============================================
          1C CI/CD Pipeline Deployment Log
          ==============================================
          Configuration: $env:CONFIG_NAME
          Overall Status: $overallStatus
          Deploy Status: $deployStatus
          Test Status: $testStatus
          Run ID: $env:GITHUB_RUN_ID
          Branch: $env:GITHUB_REF_NAME
          Commit: $env:GITHUB_SHA
          Actor: $env:GITHUB_ACTOR
          Time: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
          ==============================================
          "@ | Out-File $log -Encoding UTF8
          Get-Content $log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs-${{ github.run_id }}
          path: artifacts/logs/
          retention-days: 7

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [build, test_deploy]
    if: always()
    steps:
      - name: Determine overall status
        id: status
        run: |
          if [[ "${{ needs.build.result }}" == "success" && "${{ needs.test_deploy.result }}" == "success" ]]; then
            echo "status=✅ SUCCESS" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "color=#28a745" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.build.result }}" == "failure" || "${{ needs.test_deploy.result }}" == "failure" ]]; then
            echo "status=❌ FAILED" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "color=#dc3545" >> $GITHUB_OUTPUT
          else
            echo "status=⚠️ PARTIAL" >> $GITHUB_OUTPUT
            echo "emoji=⚠️" >> $GITHUB_OUTPUT
            echo "color=#ffc107" >> $GITHUB_OUTPUT
          fi

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          connection_url: smtps://smtp.gmail.com:465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ steps.status.outputs.emoji }} 1C CI/CD Pipeline - ${{ steps.status.outputs.status }}"
          to: andreymatanin@gmail.com
          from: 1C CI/CD Pipeline <${{ secrets.MAIL_USERNAME }}>
          html_body: |
            <!DOCTYPE html>
            <html>
            <head>
              <style>
                body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
                .container { max-width: 600px; margin: 0 auto; padding: 20px; }
                .header { background: ${{ steps.status.outputs.color }}; color: white; padding: 20px; text-align: center; border-radius: 5px 5px 0 0; }
                .content { background: #f9f9f9; padding: 20px; border: 1px solid #ddd; border-top: none; }
                .info-block { background: white; padding: 15px; margin: 10px 0; border-left: 4px solid ${{ steps.status.outputs.color }}; }
                .info-row { margin: 8px 0; }
                .label { font-weight: bold; color: #555; }
                .value { color: #333; }
                .footer { text-align: center; padding: 15px; color: #777; font-size: 12px; }
                .button { display: inline-block; padding: 10px 20px; background: ${{ steps.status.outputs.color }}; color: white; text-decoration: none; border-radius: 5px; margin: 10px 5px; }
                .status-badge { font-size: 24px; font-weight: bold; }
              </style>
            </head>
            <body>
              <div class="container">
                <div class="header">
                  <h1>${{ steps.status.outputs.emoji }} 1C CI/CD Pipeline</h1>
                  <p class="status-badge">${{ steps.status.outputs.status }}</p>
                </div>
                
                <div class="content">
                  <div class="info-block">
                    <h3>📦 Configuration Details</h3>
                    <div class="info-row">
                      <span class="label">Configuration:</span>
                      <span class="value">${{ env.CONFIG_NAME }}</span>
                    </div>
                    <div class="info-row">
                      <span class="label">Repository:</span>
                      <span class="value">${{ github.repository }}</span>
                    </div>
                    <div class="info-row">
                      <span class="label">Branch:</span>
                      <span class="value">${{ github.ref_name }}</span>
                    </div>
                  </div>

                  <div class="info-block">
                    <h3>🔧 Build Information</h3>
                    <div class="info-row">
                      <span class="label">Build Status:</span>
                      <span class="value">${{ needs.build.result == 'success' && '✅ Success' || '❌ Failed' }}</span>
                    </div>
                    <div class="info-row">
                      <span class="label">Deploy Status:</span>
                      <span class="value">${{ needs.test_deploy.result == 'success' && '✅ Success' || needs.test_deploy.result == 'failure' && '❌ Failed' || '⚠️ Skipped' }}</span>
                    </div>
                    <div class="info-row">
                      <span class="label">Run ID:</span>
                      <span class="value">#${{ github.run_id }}</span>
                    </div>
                  </div>

                  <div class="info-block">
                    <h3>👤 Commit Information</h3>
                    <div class="info-row">
                      <span class="label">Author:</span>
                      <span class="value">${{ github.actor }}</span>
                    </div>
                    <div class="info-row">
                      <span class="label">Commit:</span>
                      <span class="value">${{ github.sha }}</span>
                    </div>
                    <div class="info-row">
                      <span class="label">Message:</span>
                      <span class="value">${{ github.event.head_commit.message }}</span>
                    </div>
                  </div>

                  <div style="text-align: center; margin-top: 20px;">
                    <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" class="button">
                      📊 View Workflow Run
                    </a>
                    <a href="${{ github.server_url }}/${{ github.repository }}" class="button">
                      📂 View Repository
                    </a>
                  </div>
                </div>

                <div class="footer">
                  <p>This is an automated message from GitHub Actions</p>
                  <p>Fnai1/Project CI/CD Pipeline</p>
                </div>
              </div>
            </body>
            </html>
          priority: high
